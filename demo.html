<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Emotion Recognition Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        input[type="file"], textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="file"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        .btn-clear:hover {
            background: #e0e0e0;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 14px;
            display: none;
        }
        .results {
            display: none;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .result-grid { grid-template-columns: 1fr; }
            .input-section { grid-template-columns: 1fr; }
        }
        .result-card {
            background: white;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .result-card.speech { border-left-color: #ff6b6b; }
        .result-card.text { border-left-color: #4ecdc4; }
        .result-card.fused { border-left-color: #ffd93d; }
        .result-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .emotion {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        .confidence {
            font-size: 14px;
            color: #666;
        }
        .fusion-info {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-top: 15px;
        }
        .fusion-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        .weight-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
            color: #666;
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .success-badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Multimodal Emotion Recognition</h1>
        <p class="subtitle">Combine speech and text to detect emotions</p>
        
        <div class="input-section">
            <div class="input-group">
                <label for="audioFile">🎤 Upload Audio File (.wav)</label>
                <input type="file" id="audioFile" accept=".wav,.mp3">
            </div>
            <div class="input-group">
                <label for="textInput">📝 Enter Text</label>
                <textarea id="textInput" placeholder="What are you feeling? Write something..."></textarea>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-submit" onclick="submitMultimodal()">Analyze Emotion</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>

        <div class="loading">⏳ Analyzing emotion with speech and text models...</div>
        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="result-grid">
                <div class="result-card speech">
                    <div class="result-title">🗣️ Speech</div>
                    <div class="emotion" id="speechEmotion">-</div>
                    <div class="confidence" id="speechConfidence">-</div>
                </div>
                <div class="result-card text">
                    <div class="result-title">📄 Text</div>
                    <div class="emotion" id="textEmotion">-</div>
                    <div class="confidence" id="textConfidence">-</div>
                </div>
                <div class="result-card fused">
                    <div class="result-title">✨ FINAL FUSED</div>
                    <div class="emotion" id="finalEmotion">-</div>
                    <div class="confidence" id="finalConfidence">-</div>
                </div>
            </div>

            <div class="fusion-info">
                <div class="fusion-title">⚙️ Fusion Strategy</div>
                <div class="weight-info">
                    <div>🎤 Speech Weight: 60%</div>
                    <div>📝 Text Weight: 40%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";

        async function submitMultimodal() {
            const audioFile = document.getElementById('audioFile').files[0];
            const textInput = document.getElementById('textInput').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.querySelector('.loading');
            const resultsDiv = document.getElementById('results');

            // Validation
            if (!audioFile) {
                showError('Please upload an audio file');
                return;
            }
            if (!textInput.trim()) {
                showError('Please enter some text');
                return;
            }

            // Show loading, hide previous results
            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            resultsDiv.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('file', audioFile);
                formData.append('text', textInput);

                const response = await fetch(`${API_BASE}/multimodal/predict`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                // Display results
                document.getElementById('speechEmotion').textContent = data.speech_prediction.toUpperCase();
                document.getElementById('speechConfidence').textContent = 
                    `${(data.speech_probabilities[data.speech_prediction] * 100).toFixed(2)}% confidence`;
                
                document.getElementById('textEmotion').textContent = data.text_prediction.toUpperCase();
                document.getElementById('textConfidence').textContent = 
                    `${(data.text_probabilities[data.text_prediction] * 100).toFixed(2)}% confidence`;
                
                document.getElementById('finalEmotion').textContent = data.final_prediction.toUpperCase();
                document.getElementById('finalConfidence').textContent = 
                    `${(data.confidence * 100).toFixed(2)}% confidence`;

                loadingDiv.style.display = 'none';
                resultsDiv.style.display = 'block';

            } catch (err) {
                showError(`Error: ${err.message}. Make sure backend is running on http://127.0.0.1:8000`);
                loadingDiv.style.display = 'none';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function clearAll() {
            document.getElementById('audioFile').value = '';
            document.getElementById('textInput').value = '';
            document.getElementById('error').style.display = 'none';
            document.querySelector('.loading').style.display = 'none';
            document.getElementById('results').style.display = 'none';
        }
    </script>
</body>
</html>
